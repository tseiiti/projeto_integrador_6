<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Responsivo</title>
  <link rel="stylesheet" href="teste3.css">
</head>
<body>
  <nav class="navbar" aria-label="Navegação Principal">
    <div class="nav-logo">Brand Logo</div>
    <button 
      id="menuToggle"
      class="nav-toggle" 
      aria-expanded="false" 
      aria-label="Abrir menu de navegação"
    >
      <span class="hamburger"></span>
    </button>

    <!-- Fundo escuro quando o menu mobile estiver aberto -->
    <div id="navOverlay" class="nav-overlay"></div>
    
    <ul id="navLinks" class="nav-links">
      <li><a href="#home" class="nav-item">Home</a></li>
      <li><a href="#services" class="nav-item">Serviços</a></li>
      <li><a href="#about" class="nav-item">Sobre</a></li>
      <li><a href="#contact" class="nav-item">Contato</a></li>
    </ul>
  </nav>

  <div>teste</div>

  <script src="teste3.js"></script>
</body>
</html>
