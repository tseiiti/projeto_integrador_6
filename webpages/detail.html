
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Detalhes-AI Chat</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="/script/tailwind.js"></script>
    <link href="/style/inter_manrope.css" rel="stylesheet">
    <link href="/style/material_symbols_outlined.css" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #4F46E5;
        --color-primary-dim: #4338CA;
        --color-primary-container: #E0E7FF;
        --color-on-primary: #FFFFFF;
        --color-on-primary-container: #1E1B4B;
        --color-secondary: #6366F1;
        --color-secondary-container: #EEF2FF;
        --color-on-secondary-container: #312E81;
        --color-surface: #F9FAFB;
        --color-surface-dim: #F3F4F6;
        --color-surface-bright: #FFFFFF;
        --color-surface-container-lowest: #FFFFFF;
        --color-surface-container-low: #F9FAFB;
        --color-surface-container: #F3F4F6;
        --color-surface-container-high: #E5E7EB;
        --color-surface-container-highest: #D1D5DB;
        --color-on-surface: #111827;
        --color-on-surface-variant: #4B5563;
        --color-outline: #9CA3AF;
        --color-outline-variant: #E5E7EB;
        --color-background: #F9FAFB;
        --color-on-background: #111827;
        
        --font-family-headline: Inter, sans-serif;
        --font-family-body: Inter, sans-serif;
        --font-family-label: Inter, sans-serif;

        --rounded: 0.125rem;
        --rounded-lg: 0.25rem;
        --rounded-xl: 0.5rem;
        --rounded-full: 0.75rem;
        --spacing-container-max: 1280px;
        --spacing-sm: 8px;
        --spacing-xl: 32px;
        --spacing-md: 16px;
        --spacing-xs: 4px;
        --spacing-base: 4px;
        --spacing-2xl: 48px;
        --spacing-lg: 24px;
        --spacing-3xl: 64px;
        --spacing-gutter: 24px;

        --text-body-md: 14px;
        --text-body-md--line-height: 20px;
        --text-body-md--font-weight: 400;
        --text-label-md: 14px;
        --text-label-md--line-height: 20px;
        --text-label-md--font-weight: 500;
        --text-headline-lg: 30px;
        --text-headline-lg--line-height: 36px;
        --text-headline-lg--letter-spacing: -0.02em;
        --text-headline-lg--font-weight: 700;
        --text-headline-md: 20px;
        --text-headline-md--line-height: 28px;
        --text-headline-md--letter-spacing: -0.01em;
        --text-headline-md--font-weight: 600;
        --text-body-lg: 16px;
        --text-body-lg--line-height: 24px;
        --text-body-lg--font-weight: 400;
        --text-label-sm: 12px;
        --text-label-sm--line-height: 16px;
        --text-label-sm--letter-spacing: 0.05em;
        --text-label-sm--font-weight: 600;
        --text-headline-lg-mobile: 24px;
        --text-headline-lg-mobile--line-height: 32px;
        --text-headline-lg-mobile--letter-spacing: -0.02em;
        --text-headline-lg-mobile--font-weight: 700;
      }
    </style>
    <link href="/style/detail.css" rel="stylesheet">
    <script src="/script/base.js"></script>
    <script src="/script/detail.js"></script>
</head>
<body class="font-body overflow-hidden">
    <!-- TopNavBar Shell -->
    <header class="fixed top-0 right-0 left-0 h-16 z-40 bg-white/80 dark:bg-white/80 backdrop-blur-md border-b border-outline-variant flex justify-between items-center px-8 w-auto">
        <div class="flex items-center gap-8 flex-1 min-w-0">
            <a href="/">
                <h2 class="text-lg font-black tracking-tighter text-on-secondary-container shrink-0">
                    Chat IA
                </h2>
            </a>
            <nav class="flex items-center gap-2 overflow-x-auto hide-scrollbar mask-gradient relative py-1 custom-scrollbar">
                <div class="flex items-center gap-6 whitespace-nowrap font-['Inter'] text-sm font-semibold px-2 uppercase">
                    <p class="text-on-surface-variant">
                        Detalhes
                    </p>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="ml-0 mt-16 h-[calc(100dvh-64px)] flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-8 lg:px-24 space-y-8">
        <h3 class="text-2xl mb-0"></h3>
        <p class="text-gray-500 mb-8 model"></p>

        <h4 class="mt-8 mb-2 font-bold text-gray-600">Mensagem</h4>
        <p class="content text-justify"></p>

        <h4 class="mt-8 mb-2 font-bold text-gray-600">Contextos</h4>
        <table class="w-full table-auto border-collapse text-sm contexts">
            <thead>
                <tr>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500 min-w-[80px]">
                        Score
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500 min-w-[80px]">
                        Calculado
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Conteúdo
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Tamanho
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white"></tbody>
        </table>

        <h4 class="mt-8 mb-2 font-bold text-gray-600">Transferências (tokens)</h4>
        <table class="w-full table-auto border-collapse text-sm tokens">
            <thead>
                <tr>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Envidados
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Recebidos
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Taxa de Transferência
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white"></tbody>
        </table>

        <h4 class="mt-8 mb-2 font-bold text-gray-600">Tempos</h4>
        <table class="w-full table-auto border-collapse text-sm times">
            <thead>
                <tr>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Início
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Contexto
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Pensamento
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Exibição
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Término
                    </th>
                    <th class="border-b border-gray-200 text-left p-4 text-gray-500">
                        Total
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white"></tbody>
        </table>
        
        <h4 class="mt-8 mb-2 font-bold text-gray-600">Filtros</h4>
        <table class="">
            <tbody class="bg-white">
                <tr class="border-b border-gray-100 text-gray-500">
                    <td class="p-2 text-sm font-bold">Pergunta:</td>
                    <td class="p-2 text-lg font-normal text-gray-800 italic pl-2 prompt"></td>
                </tr>
                <tr class="border-b border-gray-100 text-gray-500">
                    <td class="p-2 text-sm font-bold">Categoria:</td>
                    <td class="p-2 font-normal text-gray-800 italic pl-2 file"></td>
                </tr>
                <tr class="border-b border-gray-100 text-gray-500">
                    <td class="p-2 text-sm font-bold">Score:</td>
                    <td class="p-2 font-normal text-gray-800 italic pl-2 score"></td>
                </tr>
                <tr class="border-b border-gray-100 text-gray-500">
                    <td class="p-2 text-sm font-bold">Temperatura:</td>
                    <td class="p-2 font-normal text-gray-800 italic pl-2 temperature"></td>
                </tr>
            </tbody>
        </table>
    </main>

    <div class="fixed top-24 right-8 lg:right-24">
        <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-1 px-4 border border-blue-500 hover:border-transparent rounded" onclick="history.back()">
            Voltar
        </button>
    </div>
</body>
</html>
