<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Configurações - AI Chat</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        @theme {
            /* Colors */
            --color-on-background: #191c1d;
            --color-on-secondary-container: #5c6274;
            --color-surface-bright: #f8f9fa;
            --color-primary-fixed: #e2dfff;
            --color-on-tertiary: #ffffff;
            --color-tertiary-fixed-dim: #ffb695;
            --color-surface-container: #edeeef;
            --color-on-tertiary-fixed: #351000;
            --color-on-primary: #ffffff;
            --color-on-secondary-fixed: #141b2b;
            --color-primary-fixed-dim: #c3c0ff;
            --color-secondary-fixed-dim: #c0c6db;
            --color-on-secondary: #ffffff;
            --color-error-container: #ffdad6;
            --color-outline: #777587;
            --color-on-error: #ffffff;
            --color-surface-container-highest: #e1e3e4;
            --color-surface-container-low: #f3f4f5;
            --color-outline-variant: #c7c4d8;
            --color-on-primary-fixed-variant: #3323cc;
            --color-surface-container-high: #e7e8e9;
            --color-text-main: #111827;
            --color-surface-variant: #e1e3e4;
            --color-inverse-surface: #2e3132;
            --color-on-error-container: #93000a;
            --color-secondary-container: #d9dff5;
            --color-background: #f8f9fa;
            --color-surface-tint: #4d44e3;
            --color-surface-white: #ffffff;
            --color-secondary-fixed: #dce2f7;
            --color-inverse-primary: #c3c0ff;
            --color-surface-container-lowest: #ffffff;
            --color-primary: #3525cd;
            --color-tertiary: #7e3000;
            --color-text-muted: #4b5563;
            --color-error: #ba1a1a;
            --color-surface-dim: #d9dadb;
            --color-on-secondary-fixed-variant: #404758;
            --color-primary-container: #4f46e5;
            --color-on-tertiary-container: #ffd2be;
            --color-on-tertiary-fixed-variant: #7b2f00;
            --color-on-surface: #191c1d;
            --color-inverse-on-surface: #f0f1f2;
            --color-on-primary-fixed: #0f0069;
            --color-on-surface-variant: #464555;
            --color-secondary: #575e70;
            --color-on-primary-container: #dad7ff;
            --color-tertiary-container: #a44100;
            --color-border-subtle: #e5e7eb;
            --color-surface: #f8f9fa;
            --color-tertiary-fixed: #ffdbcc;

            /* Spacing */
            --spacing-container-max: 1280px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            --spacing-3xl: 64px;
            --spacing-base: 4px;
            --spacing-gutter: 24px;
        }
    </style>
    <link rel="stylesheet" href="config.css">
    <script src="config.js"></script>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen flex">
    <!-- SideNavBar (Shared Component) -->
    <aside
        class="hidden md:flex flex-col h-screen w-64 flex-shrink-0 bg-on-background border-r border-outline-variant py-md px-sm">
        <div class="flex items-center gap-md mb-xl px-sm">
            <img alt="Logo" class="w-8 h-8 rounded-lg"
                src="favicon.png" />
            <span class="font-headline-md text-headline-md font-bold text-surface-bright">Chat Pro</span>
        </div>
        <button
            class="mb-lg w-full py-sm px-md bg-primary-container text-on-primary-container rounded-xl flex items-center justify-center gap-xs font-label-md transition-all active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined">add</span>
            Novo Chat
        </button>
        <nav class="flex-grow space-y-xs">
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="chat">chat</span>
                <span class="font-body-md text-body-md">Chats</span>
            </a>
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
                <span class="font-body-md text-body-md">Assistentes</span>
            </a>
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
                <span class="font-body-md text-body-md">Arquivos</span>
            </a>
            <a class="flex items-center gap-md py-sm px-md active-tab transition-all cursor-pointer" href="#">
                <span class="material-symbols-outlined" data-icon="settings">settings</span>
                <span class="font-body-md text-body-md">Configurações</span>
            </a>
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
                <span class="font-body-md text-body-md">Ajuda</span>
            </a>
        </nav>
        <div class="mt-auto border-t border-outline/20 pt-md space-y-xs">
            <div class="flex items-center gap-md px-md mb-md">
                <img alt="Foto do usuário" class="w-10 h-10 rounded-full border border-outline-variant"
                    src="favicon.png" />
                <div class="overflow-hidden">
                    <p class="text-surface-bright font-label-md truncate">Usuário Pro</p>
                    <p class="text-secondary-fixed-dim text-label-sm truncate">Plano Premium</p>
                </div>
            </div>
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
                <span class="font-body-md text-body-md">Perfil</span>
            </a>
            <a class="flex items-center gap-md py-sm px-md text-secondary-fixed-dim hover:text-surface-bright hover:bg-secondary/50 transition-all rounded-lg cursor-pointer"
                href="#">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                <span class="font-body-md text-body-md">Sair</span>
            </a>
        </div>
    </aside>
    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col h-screen overflow-hidden">
        <!-- TopAppBar (Shared Component) -->
        <header class="bg-surface border-b border-border-subtle">
            <div class="flex justify-between items-center w-full px-lg py-md max-w-container-max mx-auto">
                <div class="flex items-center gap-lg">
                    <h1 class="font-headline-md text-headline-md font-bold text-on-surface">Configurações</h1>
                    <nav class="hidden md:flex gap-lg">
                        <a class="text-primary border-b-2 border-primary pb-1 font-label-md" href="#perfil">Geral</a>
                        <a class="text-text-muted hover:text-text-main transition-colors font-label-md"
                            href="#seguranca">Faturamento</a>
                        <a class="text-text-muted hover:text-text-main transition-colors font-label-md"
                            href="#notificacoes">Notificações</a>
                    </nav>
                </div>
                <div class="flex items-center gap-md">
                    <div class="relative hidden sm:block">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-[20px]">search</span>
                        <input
                            class="bg-surface-container-low border border-outline-variant rounded-full py-xs pl-10 pr-md text-body-md w-64 focus:outline-none focus:border-primary"
                            placeholder="Buscar configurações..." type="text" />
                    </div>
                    <button class="p-sm text-text-muted hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <button class="p-sm text-text-muted hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                    <img alt="Avatar do usuário"
                        class="w-8 h-8 rounded-full border border-border-subtle cursor-pointer active:scale-95 transition-all"
                        src="favicon.png" />
                </div>
            </div>
        </header>
        <!-- Scrollable Canvas -->
        <iframe src="config.html" width="100%" height="100%"></iframe>
    </main>
    <!-- Toast Notification (Success) -->
    <div class="fixed bottom-lg right-lg transform translate-y-20 opacity-0 transition-all duration-300 bg-inverse-surface text-inverse-on-surface px-xl py-md rounded-xl shadow-2xl flex items-center gap-md z-50"
        id="success-toast">
        <span class="material-symbols-outlined text-green-400">check_circle</span>
        <div>
            <p class="font-label-md text-label-md">Sucesso!</p>
            <p class="text-label-sm opacity-80">Suas configurações foram atualizadas.</p>
        </div>
    </div>
</body>

</html>
