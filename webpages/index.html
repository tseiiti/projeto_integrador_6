<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AI Chat</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <script src="/script/tailwind.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #4F46E5;
        --color-primary-dim: #4338CA;
        --color-primary-container: #E0E7FF;
        --color-on-primary: #FFFFFF;
        --color-on-primary-container: #1E1B4B;
        --color-secondary: #6366F1;
        --color-secondary-container: #EEF2FF;
        --color-on-secondary-container: #312E81;
        --color-surface: #F9FAFB;
        --color-surface-dim: #F3F4F6;
        --color-surface-bright: #FFFFFF;
        --color-surface-container-lowest: #FFFFFF;
        --color-surface-container-low: #F9FAFB;
        --color-surface-container: #F3F4F6;
        --color-surface-container-high: #E5E7EB;
        --color-surface-container-highest: #D1D5DB;
        --color-on-surface: #111827;
        --color-on-surface-variant: #4B5563;
        --color-outline: #9CA3AF;
        --color-outline-variant: #E5E7EB;
        --color-background: #F9FAFB;
        --color-on-background: #111827;
        
        --font-family-headline: Inter, sans-serif;
        --font-family-body: Inter, sans-serif;
        --font-family-label: Inter, sans-serif;

        --rounded: 0.25rem;
        --rounded-lg: 0.5rem;
        --rounded-xl: 0.75rem;
        --rounded-full: 9999px;
        --spacing-container-max: 1280px;
        --spacing-sm: 8px;
        --spacing-xl: 32px;
        --spacing-md: 16px;
        --spacing-xs: 4px;
        --spacing-base: 4px;
        --spacing-2xl: 48px;
        --spacing-lg: 24px;
        --spacing-3xl: 64px;
        --spacing-gutter: 24px;

        --text-body-md: 14px;
        --text-body-md--line-height: 20px;
        --text-body-md--font-weight: 400;
        --text-label-md: 14px;
        --text-label-md--line-height: 20px;
        --text-label-md--font-weight: 500;
        --text-headline-lg: 30px;
        --text-headline-lg--line-height: 36px;
        --text-headline-lg--letter-spacing: -0.02em;
        --text-headline-lg--font-weight: 700;
        --text-headline-md: 20px;
        --text-headline-md--line-height: 28px;
        --text-headline-md--letter-spacing: -0.01em;
        --text-headline-md--font-weight: 600;
        --text-body-lg: 16px;
        --text-body-lg--line-height: 24px;
        --text-body-lg--font-weight: 400;
        --text-label-sm: 12px;
        --text-label-sm--line-height: 16px;
        --text-label-sm--letter-spacing: 0.05em;
        --text-label-sm--font-weight: 600;
        --text-headline-lg-mobile: 24px;
        --text-headline-lg-mobile--line-height: 32px;
        --text-headline-lg-mobile--letter-spacing: -0.02em;
        --text-headline-lg-mobile--font-weight: 700;
      }
    </style>
    <link href="/style/inter_manrope.css" rel="stylesheet">
    <link href="/style/material_symbols_outlined.css" rel="stylesheet">
    <link href="/style/index.css" rel="stylesheet">
    <script src="/script/showdown.min.js"></script>
    <script src="/script/base.js"></script>
    <script src="/script/index.js"></script>
</head>
<body class="font-body overflow-hidden">
    <!-- TopNavBar Shell -->
    <header class="fixed top-0 right-0 left-0 h-16 z-40 bg-white/80 dark:bg-white/80 backdrop-blur-md border-b border-outline-variant flex items-center">
        <div class="flex justify-between items-center px-4 sm:px-8 lg:px-24 w-full max-w-[1200px] mx-auto relative">
            <div class="flex items-center gap-8 flex-1 min-w-0 px-2">
                <a href="/">
                    <h2 class="text-lg font-black tracking-tighter text-on-secondary-container shrink-0">
                        Chat IA
                    </h2>
                </a>
                <nav class="flex items-center gap-2 overflow-x-auto hide-scrollbar mask-gradient pt-1 h-12 custom-scrollbar">
                    <div class="flex items-center gap-6 whitespace-nowrap font-['Inter'] text-sm font-semibold px-2 uppercase">
                        <p class="text-on-surface-variant model">
                        </p>
                    </div>
                </nav>
            </div>
            <a href="/config.html">
                <div class="w-12 h-12 rounded-2xl bg-white px-2 flex items-center justify-center text-violet-600 shadow-sm border border-slate-100 shrink-0 ml-4">
                    <span class="material-symbols-outlined" style="font-size: 32px;">tune</span>
                </div>
            </a>

            <!-- Floating Background Decorative Elements -->
            <div class="absolute top-16 left-6 sm:left-10 lg:left-26">
                <!-- File -->
                <div class="flex items-center justify-end mt-2 mb-1" title="Permite filtrar por uma categoria para geração do contexto">
                    <span class="text-[12px] text-gray-400 pr-1">Categoria:</span>
                    <select class="bg-transparent border-none focus:outline-none focus:ring-0 transition duration-300 ease placeholder:text-slate-400 cursor-pointer text-slate-700 text-sm p-0 categories" name="select_categories" onchange="resize_select()">
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="ml-0 mt-16 h-[calc(100dvh-64px)] relative flex flex-col glow-accent">
        <section class="flex-grow overflow-y-auto custom-scrollbar bg-background p-md max-w-[1200px] mx-auto w-full h-full">

            <!-- Message Stream Area -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-8 lg:px-24 space-y-8 min-h-[calc(100dvh/2-164px)]">
                <div class="messages"></div>
                <div class="messages-end"></div>
            </div>

            <!-- Shell Area -->
            <div class="sm:px-12 lg:px-24 py-4 bg-gradient-to-t from-background via-background to-transparent">
                <div class="max-w-4xl mx-auto">

                    <!-- Input Area -->
                    <div class="bg-white rounded-2xl p-2 shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-outline-variant focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/5 transition-all duration-500">
                        <form id="form_chat_api">
                            <div class="flex items-center gap-2 px-2 py-1">
                                <span class="material-symbols-outlined ml-1 text-outline text-on-surface cursor-pointer" onclick="paste_text(qs('.prompt'))">article</span>
                                <textarea name="textarea_prompt"
                                    class="flex-1 bg-transparent border-none focus:outline-none focus:ring-0 text-sm py-3 px-2 resize-none h-11 max-h-48 custom-scrollbar placeholder:text-outline text-on-surface font-medium prompt"
                                    placeholder="Escreva a mensagem a ser enviada ao Assistente" rows="2"
                                    onkeydown="handle_enter(event)"></textarea>
                                <div class="flex items-center gap-1 mb-0.5">
                                    <button type="submit"
                                        class="ml-2 w-10 h-10 rounded-xl bg-primary text-white cursor-pointer flex items-center justify-center shadow-lg shadow-primary/20 hover:bg-primary-dim hover:scale-105 active:scale-95 transition-all">
                                        <span class="material-symbols-outlined"
                                            style="font-variation-settings: 'FILL' 1;">send</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Info Area -->
                    <div class="relative flex justify-center mt-2">
                        <!-- Model -->
                        <p class="text-[10px] text-on-surface-variant/80 flex items-center gap-1.5 font-bold cursor-pointer pr-5">
                            <span class="material-symbols-outlined text-[24px] text-primary">graph_8</span>
                            <span class="uppercase model"></span>
                        </p>

                        <!-- Clear -->
                        <!-- <p class="text-[10px] text-on-surface-variant/80 flex items-center gap-1 font-bold cursor-pointer pr-5"
                            onclick="messages_clear();"
                            title="Limpar a conversa">
                            <span class="material-symbols-outlined text-[20px] text-primary">contract_delete</span>
                            <span class="token">NOVO CHAT</span> -->
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
