
services:
  frontend:
    build:
      dockerfile: ./dockerfile
      context: ./frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # environment:
    #   - CHOKIDAR_USEPOLLING=true # Required for React hot-reloading on Windows hosts
    stdin_open: true
    tty: true
