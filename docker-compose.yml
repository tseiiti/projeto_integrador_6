services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"
      - OLLAMA_KEEP_ALIVE=-1
    ports:
      - 11434:11434
    networks:
      - internal_network

  python:
    build:
      dockerfile: python.dockerfile
    volumes:
      - ./embedding:/home
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - API_HOST=0.0.0.0
    ports:
      - 8000:8000
    networks:
      - internal_network
    depends_on:
      - ollama
      
  react:
    build:
      dockerfile: ./dockerfile
      context: ./react
    ports:
      - 5173:5173
      - 80:80
    networks:
      - internal_network
    volumes:
      - ./react:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - python

  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webpages:/home
    ports:
      - 80:80
      - 443:443
      - 8000:8000
      - 11434:11434
    networks:
      - internal_network
      - internet_access
    depends_on:
      - react
    # restart: unless-stopped

volumes:
  ollama:

networks:
  internal_network:
    internal: true
  internet_access:
