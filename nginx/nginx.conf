worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

	gzip on;
    gzip_disable "msie6";
    # gzip_min_length 10;
    gzip_vary on;
    gzip_proxied any;
    # gzip_comp_level 9;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript font/woff2 image/png;

    server {
        listen      80 default_server;
        listen [::]:80 default_server;

        location / {
            return 404;
        }

        location /404.html {
            internal;
        }
    }

    server {
        server_name tseiiti.duckdns.org projeto-integrador-6.vercel.app 192.168.15.11 localhost;

        listen      80;
        listen [::]:80;

        return 301 https://$host$request_uri;
    }

    server {
        server_name tseiiti.duckdns.org projeto-integrador-6.vercel.app 192.168.*.* localhost;

        listen      443 ssl;
        listen [::]:443 ssl;

        ssl_certificate /etc/ssl/private/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;

        location / {
            expires 1h;
            root    /home;
            index   index.html;
        }
    }

    server {
        server_name tseiiti.duckdns.org projeto-integrador-6.vercel.app 192.168.*.* localhost;

        listen      8000 ssl;
        listen [::]:8000 ssl;

        ssl_certificate /etc/ssl/private/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;

        location / {
            proxy_pass http://python:8000/;
        }
    }

    server {
        server_name tseiiti.duckdns.org projeto-integrador-6.vercel.app 192.168.*.* localhost;

        listen      11434 ssl;
        listen [::]:11434 ssl;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        ssl_certificate /etc/ssl/private/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;

        location / {
            proxy_pass http://ollama:11434/;
        }
    }
}
